spring:
  application:
    name: car-rental-backend

  # Configuration de la base de données
  datasource:
    url: jdbc:postgresql://localhost:5432/car_rental_db
    username: postgres
    password: salah
    driver-class-name: org.postgresql.Driver

  # Configuration JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Configuration des fichiers uploadés
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Configuration du serveur
server:
  port: 8080
  servlet:
    context-path: /api

# Configuration de l'application
app:
  # Configuration JWT
  jwt:
    secret: carRentalSecretKey2024MustBeAtLeast32Characters
    expiration-ms: 86400000  # 24 heures

  # Configuration des uploads (photos des voitures)
  upload:
    dir: uploads/cars
  base-url: http://localhost:8080/api

  # Configuration WhatsApp (à configurer plus tard)
  whatsapp:
    enabled: false
    api-url: http://localhost:3000/send
    phone-number-id: your_phone_id
    access-token: your_access_token

  # Configuration de la remise pour la 6ème réservation
  remise:
    pourcentage: 10
    active: true

# Logging
logging:
  level:
    com.rental: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
    org.springframework.security: DEBUG